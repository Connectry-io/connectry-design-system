<style>
:root{--ground:#f5f5f7;--surface:#ffffff;--ink:#1a1a1a;--body:#43444d;--muted:#5b5c66;--faint:#80818d;--hairline:rgba(0,0,0,0.06);--blue:#4a6fa5;--blue-hover:#436598;--blue-light:#7fa3d6;--blue-tint:rgba(74,111,165,0.10);--chart-accent:var(--blue);--chart-comparison:#9a9ba6;--chart-step-1:#c2c3ca;--chart-step-2:#e0e1e6;--chart-grid:#e4e4e8;--scrim:rgba(0,0,0,0.42);--glass-tint-top:rgba(255,255,255,0.40);--glass-tint-bottom:rgba(255,255,255,0.26);--glass-dark-top:rgba(255,255,255,0.74);--glass-dark-bottom:rgba(255,255,255,0.62);--glass-nav:rgba(255,255,255,0.62);--glass-rim:rgba(255,255,255,0.95);--bloom-blue:#4a6fa5;--bloom-warm:#ffd9b0;--film-host-page:#f2f2ee;--film-host-paper:#fafaf8;--endcard-black:#050505;--shadow-glass:inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(0,0,0,0.06), 0 30px 80px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.10);--shadow-glass-ground:inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(0,0,0,0.06), 0 30px 80px rgba(0,0,0,0.18), 0 2px 6px rgba(0,0,0,0.06);--shadow-doc:0 1px 0 rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.14);--shadow-ask:0 24px 60px rgba(0,0,0,0.18);--shadow-stage:0 12px 40px rgba(0,0,0,0.06);--shadow-knob:0 1px 3px rgba(0,0,0,0.18);--opacity-disabled:0.4;--opacity-bloom-blue:0.18;--opacity-bloom-warm:0.15;--opacity-scrim:0.42;--opacity-second-line:0.78;--opacity-film-vignette:0.13;--opacity-endcard-atmosphere:0.2;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-12:48px;--space-18:72px;--space-30:120px;--radius-panel:16px;--radius-card:12px;--radius-tile:10px;--radius-doc:8px;--radius-ask:24px;--radius-pill:999px;--font-sans:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;--font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
[data-theme="film"]{--ground:#1a1a1a;--surface:#232329;--ink:#ffffff;--body:#c9cad1;--muted:#a7a8b2;--faint:#8e8f9a;--hairline:rgba(255,255,255,0.12)}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-sans);background:var(--ground);color:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01","tnum"}
h1,h2,h3,h4{margin:0;color:var(--ink);font-weight:500;letter-spacing:-.02em;line-height:1.08}
p{margin:0}
button,input{font:inherit}
.stage{padding:24px}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--faint);line-height:1.2}
.cap{font-size:13px;color:var(--muted);line-height:1.45;max-width:760px}
.acc{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
/* ---- Connectry glass ---- */
.glass{position:relative;isolation:isolate;overflow:hidden;border-radius:var(--radius-panel);color:var(--ink);
 background:linear-gradient(180deg,var(--glass-tint-top),var(--glass-tint-bottom));
 -webkit-backdrop-filter:blur(2px) saturate(1.7) brightness(1.04);
 backdrop-filter:blur(2px) saturate(1.7) brightness(1.04);
 backdrop-filter:url(#lens) blur(2px) saturate(1.7) brightness(1.04);
 box-shadow:var(--shadow-glass)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:4;
 background:linear-gradient(180deg,#fff 0%,rgba(255,255,255,.12) 45%,rgba(255,255,255,.28) 100%);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
 mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.glass>*{position:relative;z-index:3}
.glass--dark{background:linear-gradient(180deg,var(--glass-dark-top),var(--glass-dark-bottom))}
.glass--ground{box-shadow:var(--shadow-glass-ground);-webkit-backdrop-filter:blur(2px) saturate(1.7) brightness(1.04);backdrop-filter:blur(2px) saturate(1.7) brightness(1.04)}
.glass--nav{border-radius:0;background:var(--glass-nav);-webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);box-shadow:inset 0 -1px 0 var(--hairline)}
.glass--nav::before{display:none}
/* inside glass */
.g-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.g-lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--muted);line-height:1.2}
.g-title{font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1.12;color:var(--ink)}
.g-line{font-size:15px;line-height:1.5;color:var(--ink)}
.g-sub{font-size:13px;line-height:1.45;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;line-height:1}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.st--live{color:var(--blue)}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.06);font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap}
.rows{display:grid}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:baseline;padding:11px 0;border-top:1px solid rgba(0,0,0,.07)}
.row:first-child{border-top:0}
.row .t{font-size:13px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.row .x{font-size:15px;line-height:1.45;color:var(--ink)}
.row .x small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.well{border-radius:12px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),0 1px 2px rgba(0,0,0,.05)}
.doc{border-radius:var(--radius-doc);background:var(--surface);box-shadow:var(--shadow-doc);padding:12px 14px;display:grid;gap:6px}
.doc .dl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--faint)}
.doc .dt{font-size:14px;font-weight:500;color:var(--ink);line-height:1.25}
.doc .dr{height:5px;border-radius:3px;background:#ececf0}
.members{display:flex;align-items:center}
.members i{flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-style:normal;font-size:11px;font-weight:500;display:grid;place-items:center;margin-left:-7px;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.members i:nth-child(2){background:#5b7fb3}.members i:nth-child(3){background:#43444d}.members i:nth-child(4){background:#80818d}
.members i:first-child{margin-left:0}
.members span{font-size:12px;color:var(--muted);margin-left:10px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 22px;border-radius:999px;border:0;background:var(--blue);color:#fff;font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap}
.pill--ghost{background:rgba(255,255,255,.7);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.tl{white-space:nowrap;font-size:13px;font-weight:500;color:var(--blue);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.tl--muted{color:var(--muted)}
.plate{position:relative;overflow:hidden;border-radius:var(--radius-panel);background:#2a2c31}
.plate>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plate>.z{position:relative;z-index:2}
.ground{position:relative;overflow:hidden;border-radius:var(--radius-panel);background:var(--ground)}
.ground::before,.ground::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.ground::before{width:70%;aspect-ratio:1;left:-12%;top:-30%;background:radial-gradient(circle,var(--bloom-blue) 0,rgba(74,111,165,0) 68%);opacity:var(--opacity-bloom-blue)}
.ground::after{width:64%;aspect-ratio:1;right:-14%;bottom:-36%;background:radial-gradient(circle,var(--bloom-warm) 0,rgba(255,217,176,0) 68%);opacity:.55}
.ground>*{position:relative;z-index:1}
.note{display:flex;gap:28px;flex-wrap:wrap;margin-top:14px}
.note div{font-size:13px;color:var(--muted);line-height:1.45}
.note b{display:block;font-weight:500;color:var(--ink);font-size:13px}
/* arrival: once, then still */
@keyframes arrive{from{opacity:0;transform:translateY(14px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes land{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.arrive{animation:arrive 1.2s cubic-bezier(.2,.7,.2,1) both}
.land{animation:land .6s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){.arrive,.land{animation:none}}


.lib{columns:4;column-gap:14px}
.lib figure{break-inside:avoid;margin:0 0 14px}
.lib img{width:100%;display:block;border-radius:6px}
.lib figcaption{font-size:11px;color:var(--muted);margin-top:5px}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}

</style>
