<meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>/* Connectry site core: tokens, type, glass, nav, hero (A1), shared section components.
   One radius family: 28 frames, 19 glass cards, 11 inner. Inter only. One blue. */
:root{
  --ground:#f5f5f7;--surface:#fff;--ink:#1a1a1a;--body:#43444d;--muted:#5b5c66;--faint:#80818d;--hair:rgba(0,0,0,.08);
  --blue:#4a6fa5;--blue-hover:#3f6093;--blue-light:#7fa3d6;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);--cine:cubic-bezier(.65,0,.25,1);--settle:cubic-bezier(.22,1,.36,1);
  --gut:max(20px,6vw);--max:1240px;
  --r-frame:28px;--r-card:19px;--r-in:11px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--body);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";overflow-x:hidden}
h1,h2,h3{color:var(--ink);font-weight:500;letter-spacing:-.03em;margin:0;text-wrap:balance}
p{margin:0;text-wrap:pretty}
a{color:inherit}
img,video{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- type scale ---------- */
.eyebrow{font-size:13px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;color:var(--blue)}
.h2{font-size:clamp(34px,5.2vw,64px);line-height:1.03;letter-spacing:-.035em}
.h3{font-size:clamp(22px,2.2vw,28px);line-height:1.15;letter-spacing:-.02em}
.lede{font-size:clamp(17px,1.45vw,20px);line-height:1.55;color:var(--body);max-width:34em}
.small{font-size:14px;color:var(--muted)}

/* ---------- glass ---------- */
.glass{position:relative;background-color:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(14px) saturate(1.7) brightness(1.04);backdrop-filter:blur(14px) saturate(1.7) brightness(1.04);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(0,0,0,.05),0 24px 60px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.06);border-radius:var(--r-card);color:var(--ink)}
.glass.on-film{background-color:rgba(255,255,255,.76);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(0,0,0,.06),0 30px 80px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.14)}
.glass.dark{background-color:rgba(24,25,28,.62);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 30px 80px rgba(0,0,0,.4)}

/* ---------- buttons, fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--r-in);border:0;background:var(--blue);color:#fff;font:inherit;font-size:15px;font-weight:500;text-decoration:none;cursor:pointer;transition:background .2s,transform .2s var(--settle)}
.btn:hover{background:var(--blue-hover)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.btn.quiet{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair)}
.join{display:flex;align-items:center;gap:8px;padding:7px;border-radius:var(--r-card);width:min(460px,100%)}
.join input{flex:1 1 0;width:0;min-width:0;height:44px;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);padding:0 10px 0 12px}
.join input::placeholder{color:#6c6d78}
.join .btn{flex:0 0 auto}
.join-note{font-size:14px;color:var(--muted);margin-top:12px;min-height:1.4em}

/* ---------- nav: no logo until you scroll ---------- */
.nav{position:fixed;left:0;right:0;top:0;z-index:50;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--gut);color:#fff;transition:background .5s var(--ease),box-shadow .5s,color .5s}
.nav>a{display:flex;align-items:center;height:100%;border-radius:6px}
.nav .lk{display:block;height:24px;width:auto;opacity:0;transform:translateY(-6px);transition:opacity .7s var(--ease),transform .7s var(--settle);pointer-events:none}
.nav .links{display:flex;align-items:center;gap:30px;font-size:15px;font-weight:500}
.nav .links a:not(.btn){text-decoration:none;opacity:.88}
.nav .links a:not(.btn):hover{opacity:1}
.nav .btn{height:38px;padding:0 16px;font-size:14px}
.nav.solid .lk{opacity:1;transform:none;pointer-events:auto}
.nav.solid.light{background:rgba(245,245,247,.74);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);box-shadow:inset 0 -1px 0 var(--hair);color:var(--ink)}
.nav.solid.dark{background:rgba(18,19,21,.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:inset 0 -1px 0 rgba(255,255,255,.08);color:#fff}
.nav.solid.light .btn.ghost{background:var(--blue);box-shadow:none}
@media (max-width:760px){.nav{height:60px;justify-content:center}.nav .links{display:none}.nav .lk{height:22px}}

/* ======================= HERO (A1) ======================= */
.hero{position:relative;height:100svh;min-height:560px;max-height:1100px;overflow:hidden;background:#000;container-type:size;color:#fff;isolation:isolate}
.hero{--u:min(1cqw,1.85cqh)}
@container (max-aspect-ratio: 4/5){.hero-in{--u:min(2.05cqw,1.1cqh)}}
.hero-in{position:absolute;inset:0;--u:min(1cqw,1.85cqh);--barh:max(46px,calc(var(--u)*5.2))}
@container (max-aspect-ratio: 4/5){.hero-in{--u:min(2.05cqw,1.1cqh);--cardh:calc(var(--u)*19.5);--barw:calc(100cqw - 36px);--cardw:calc(100cqw - 24px);--barh:64px}
 /* phones: a question may take two lines inside a slightly taller bar, never clipped */
 .hero-in .q{height:auto;max-height:2.7em;white-space:normal;line-height:1.3;overflow:hidden;font-size:15px}
 .hero-in .q .typed{display:inline}
 .hero-in .q.typing .caret,.hero-in .q .typed{transform:none}
 .hero-in .m.card .q{font-size:13px;white-space:nowrap}
 .hero-in .m.card .q .typed{display:inline-block}}
.hero video,.hero .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 42%}
.hero .still{opacity:0}.hero .still.show{opacity:1}
.hero .veil{position:absolute;inset:0;background:#000;opacity:.1;transition:opacity 3s var(--ease);pointer-events:none}
.hero .halo{position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(ellipse 48% 38% at 50% 50%,rgba(0,0,0,.42),rgba(0,0,0,0) 100%);transition:opacity 1.6s var(--ease)}
@container (max-aspect-ratio: 4/5){.hero .halo{background:radial-gradient(ellipse 90% 34% at 50% 48%,rgba(0,0,0,.5),rgba(0,0,0,0) 100%)}}
.hero .topfade{position:absolute;left:0;right:0;top:0;height:22%;background:linear-gradient(to bottom,rgba(0,0,0,.34),rgba(0,0,0,0));pointer-events:none}
.hero .x{opacity:0;transform:translateY(calc(var(--u)*.9));filter:blur(calc(var(--u)*.5));transition:opacity 1.4s var(--settle),transform 1.6s var(--settle),filter 1.4s var(--settle)}
.hero .x.in{opacity:1;transform:none;filter:none}
.hero .x.out{opacity:0;transform:translateY(calc(var(--u)*-.8));filter:blur(calc(var(--u)*.5));transition-duration:1s}
.kick{position:absolute;left:16px;right:16px;top:36.5%;margin:0;text-align:center;font-size:max(24px,calc(var(--u)*2.45));font-weight:500;letter-spacing:-.025em;line-height:1.1;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.45)}
.kick .a{color:#7fa3d6}
.hero h1.kick{font-weight:500}

.m{--r:calc(var(--u)*1.9);position:absolute;left:50%;top:46.5%;transform:translateX(-50%);width:0;height:calc(var(--u)*.14);margin-top:calc(var(--barh)/2 - var(--u)*.07);border-radius:var(--r);overflow:hidden;opacity:0;color:#1a1a1a;display:flex;flex-direction:column;
  background-color:rgba(255,255,255,0);-webkit-backdrop-filter:blur(0px) saturate(1) brightness(1);backdrop-filter:url(#lens) blur(0px) saturate(1) brightness(1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0),inset 0 -1px 0 rgba(0,0,0,0),0 0 0 rgba(255,255,255,0),0 0 0 rgba(0,0,0,0);
  transition:width 1.4s var(--cine),height 1.4s var(--cine),margin-top 1.4s var(--cine),background-color 1.4s var(--ease),box-shadow 1.4s var(--ease),backdrop-filter 1.4s var(--ease),-webkit-backdrop-filter 1.4s var(--ease),opacity 1s var(--ease),transform 1.2s var(--settle),filter 1.1s var(--ease)}
.m::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(105deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 65%);transform:translateX(-110%);opacity:0}
.m.sheen::after{animation:sheen 1.6s var(--cine) forwards}
@keyframes sheen{0%{transform:translateX(-110%);opacity:0}15%{opacity:1}100%{transform:translateX(110%);opacity:0}}
.m.line{opacity:1;background-color:rgba(255,255,255,.95);transition:width 1.5s var(--cine),opacity .6s var(--ease),height 1.4s var(--cine),margin-top 1.4s var(--cine),box-shadow 1.4s var(--ease);box-shadow:inset 0 1px 0 rgba(255,255,255,0),inset 0 -1px 0 rgba(0,0,0,0),0 0 calc(var(--u)*1.4) rgba(255,255,255,.55),0 0 0 rgba(0,0,0,0)}
.m.line.drawn{width:var(--barw,calc(var(--u)*50))}
.m.glass{opacity:1;width:var(--barw,calc(var(--u)*50));height:var(--barh);margin-top:0;background-color:rgba(255,255,255,.74);-webkit-backdrop-filter:blur(2px) saturate(1.7) brightness(1.04);backdrop-filter:url(#lens) blur(2px) saturate(1.7) brightness(1.04);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(0,0,0,.06),0 calc(var(--u)*2.6) calc(var(--u)*7) rgba(0,0,0,.42),0 2px 6px rgba(0,0,0,.12)}
.m.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 60%)}
.m.lit{box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(0,0,0,.06),0 calc(var(--u)*2.6) calc(var(--u)*7) rgba(0,0,0,.42),0 0 calc(var(--u)*2.4) rgba(127,163,214,.55)}
.qrow{flex:0 0 var(--barh);height:var(--barh);display:flex;align-items:center;gap:max(8px,var(--u));padding:0 max(6px,calc(var(--u)*.8));opacity:0;filter:blur(3px);transition:opacity .9s var(--ease) .75s,filter .9s var(--ease) .75s}
.m.glass .qrow{opacity:1;filter:none}
.tile{flex:0 0 auto;width:max(34px,calc(var(--u)*3.6));height:max(34px,calc(var(--u)*3.6));border-radius:max(9px,calc(var(--u)*1.1));background:var(--blue);display:grid;place-items:center}
.tile svg{width:42%;height:42%}
.q{flex:1;min-width:0;position:relative;height:1.4em;margin-right:6px;font-size:max(15px,calc(var(--u)*1.62));line-height:1.4em;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;transition:opacity .5s,font-size 1.4s var(--cine),color 1.4s var(--ease)}
.q .ph{position:absolute;left:0;top:0;color:#6c6d78;transition:opacity .5s}
.q .typed,.q.typing .caret{transform:translateX(var(--sx,0px))}
.q .typed{display:inline-block;transition:opacity .6s var(--ease),filter .6s var(--ease),transform .35s var(--ease)}
.q.typing .caret{transition:transform .35s var(--ease)}
.m.card .q .typed{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top;transform:none}
.q.clear .typed{opacity:0;filter:blur(3px);transform:translate(var(--sx,0px),-3px)}
.q .typed i{font-style:normal;animation:letter .28s var(--ease) both}
@keyframes letter{from{opacity:0;filter:blur(1px)}}
.q .caret{display:inline-block;width:2px;height:1.05em;background:var(--blue);vertical-align:-.15em;margin-left:1px;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.q.typing .ph{opacity:0}
.q:not(.typing) .caret{position:absolute;left:0;top:.18em;margin:0}
.q:not(.typing) .ph{left:.45em}
.q.clear .caret{opacity:0;animation:none}
.em{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-size:max(16px,calc(var(--u)*1.6));color:#1a1a1a;display:none;animation:rise 1s var(--settle) both .2s}
.em::placeholder{color:#6c6d78}
@keyframes rise{from{opacity:0;filter:blur(3px);transform:translateY(3px)}}
.go{flex:0 0 auto;height:max(34px,calc(var(--u)*3.6));min-width:max(34px,calc(var(--u)*3.6));border-radius:max(9px,calc(var(--u)*1.1));border:0;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;gap:0;padding:0;cursor:pointer;font:inherit;font-size:max(14px,calc(var(--u)*1.15));font-weight:500;transition:transform .35s var(--settle),padding 1.3s var(--cine),background .3s}
.go svg{display:block;width:max(16px,calc(var(--u)*1.45));height:max(16px,calc(var(--u)*1.45));flex:0 0 auto;transition:width .6s,opacity .4s}
.go .jt{max-width:0;overflow:hidden;white-space:nowrap;opacity:0;transition:max-width 1.3s var(--cine),opacity .8s var(--ease) .45s}
.go.dip{transform:scale(.86)}
.arow{flex:1 0 auto;min-height:0;padding:0 max(14px,calc(var(--u)*2)) max(14px,calc(var(--u)*1.5)) max(54px,calc(var(--u)*5.4));opacity:0;filter:blur(4px);transform:translateY(6px);transition:opacity .45s var(--ease),filter .45s var(--ease),transform .6s var(--ease),border-color .6s;border-top:1px solid rgba(0,0,0,0)}
.m.card .arow{opacity:1;filter:none;transform:none;border-top-color:rgba(0,0,0,.08);transition:opacity 1s var(--ease) .55s,filter 1s var(--ease) .55s,transform 1.2s var(--settle) .5s,border-color 1s .5s}
.albl{font-size:max(10px,calc(var(--u)*.9));letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:#5b5c66;margin:max(10px,calc(var(--u)*1.4)) 0 max(4px,calc(var(--u)*.55))}
.an{font-size:max(16px,calc(var(--u)*2.05));line-height:1.3;font-weight:500;letter-spacing:-.022em;color:#1a1a1a}
.k{color:var(--blue);font-weight:600;text-shadow:0 0 0 rgba(74,111,165,0),0 0 0 rgba(127,163,214,0);transition:text-shadow 1.8s var(--ease)}
.k.hl{text-shadow:0 0 .35em rgba(74,111,165,.42),0 0 1em rgba(127,163,214,.35);animation:breathe 5s ease-in-out 1.8s infinite alternate}
@keyframes breathe{to{text-shadow:0 0 .3em rgba(74,111,165,.3),0 0 .8em rgba(127,163,214,.22)}}
.m.card{width:var(--cardw,calc(var(--u)*56));height:var(--cardh,calc(var(--u)*13.6))}
@container (min-aspect-ratio: 4/5){.m.card{width:min(calc(var(--u)*56),calc(100cqw - 24px))}}
.m.card .q{color:#5b5c66;font-size:max(13px,calc(var(--u)*1.4))}
.m.card .caret{display:none}
.m.invite .q{display:none}.m.invite .em{display:block}
.m.invite .go{padding:0 max(14px,calc(var(--u)*1.6))}
.m.invite .go svg{width:0;opacity:0}
.m.invite .go .jt{max-width:14em;opacity:1}
.chip{position:absolute;left:50%;top:46.5%;transform:translateX(-50%);width:var(--barw,calc(var(--u)*50));height:max(46px,calc(var(--u)*5.2));border-radius:calc(var(--u)*1.9);display:flex;align-items:center;gap:max(7px,calc(var(--u)*.9));padding:0 max(12px,calc(var(--u)*1.4));opacity:0;filter:blur(4px);color:#1a1a1a;font-size:max(12px,calc(var(--u)*1.22));font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;
  background-color:rgba(255,255,255,.64);-webkit-backdrop-filter:blur(2px) saturate(1.6) brightness(1.03);backdrop-filter:url(#lens) blur(2px) saturate(1.6) brightness(1.03);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 calc(var(--u)*1.2) calc(var(--u)*3.4) rgba(0,0,0,.3);
  transition:top 1.5s var(--cine),width 1.5s var(--cine),height 1.5s var(--cine),border-radius 1.5s var(--cine),opacity 1.2s var(--ease),filter 1.2s var(--ease)}
.chip b{font-weight:500;color:#5b5c66;font-size:max(9px,calc(var(--u)*.86));letter-spacing:.08em;text-transform:uppercase}
.chip .d{flex:0 0 auto;width:max(6px,calc(var(--u)*.62));height:max(6px,calc(var(--u)*.62));border-radius:50%;background:var(--blue);box-shadow:0 0 calc(var(--u)*.7) rgba(74,111,165,.75)}
.chip span.t{overflow:hidden;text-overflow:ellipsis}
.lkF{position:absolute;left:50%;width:max(150px,calc(var(--u)*22));height:auto;transform:translateX(calc(-50% - 3.5%));color:#fff;overflow:visible;opacity:0;filter:drop-shadow(0 1px 10px rgba(0,0,0,.35))}
.lkF.in{opacity:1}
.lkF .mk{opacity:0}
.lkF .wd{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 40%,transparent 60%);mask-image:linear-gradient(90deg,#000 0,#000 40%,transparent 60%);-webkit-mask-size:250% 100%;mask-size:250% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:100% 0;mask-position:100% 0;transform:translateX(-18px);transition:-webkit-mask-position 1.9s cubic-bezier(.45,.05,.2,1),mask-position 1.9s cubic-bezier(.45,.05,.2,1),transform 2.1s var(--settle)}
.lkF.swish .wd{-webkit-mask-position:0 0;mask-position:0 0;transform:none}
.br{position:absolute;left:0;top:0;width:10px;height:10px;fill:#fff;opacity:0;overflow:visible;pointer-events:none;filter:blur(3px) drop-shadow(0 1px 10px rgba(0,0,0,.35));transition:left 1.8s var(--settle),top 1.8s var(--settle),opacity 1.4s var(--ease),filter 1.6s var(--ease)}
.br.on{opacity:1;filter:blur(0) drop-shadow(0 1px 10px rgba(0,0,0,.35))}
.br.still{transition:none!important}
.hero .scrollcue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:22px;height:34px;border-radius:12px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6);opacity:0;transition:opacity 1s}
.hero .scrollcue::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:#fff;animation:cue 2s var(--ease) infinite}
.hero .scrollcue.in{opacity:.8}
@keyframes cue{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){.hero *{transition:none!important;animation:none!important}}

/* ======================= shared section components ======================= */
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
.reveal{opacity:0;transform:translateY(18px);transition:opacity 1.2s var(--ease),transform 1.5s var(--settle)}
.reveal.seen{opacity:1;transform:none}
.reveal.d1{transition-delay:.12s}.reveal.d2{transition-delay:.24s}.reveal.d3{transition-delay:.36s}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
.frame{position:relative;border-radius:var(--r-frame);overflow:hidden;background:#111;aspect-ratio:16/10}
.frame video,.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame.tall{aspect-ratio:4/5}

/* thread: an ask with follow ups, in the same grammar as the hero */
.thread{width:min(480px,100%);padding:8px;display:grid;gap:0}
.thread .tq{display:flex;align-items:center;gap:10px;height:48px;padding:0 4px 0 4px}
.thread .tq .tile{width:34px;height:34px;border-radius:9px}
.thread .tq .txt{flex:1;min-width:0;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .tq .txt .cur{display:inline-block;width:2px;height:1.05em;background:var(--blue);vertical-align:-.15em;margin-left:1px;animation:blink 1.05s steps(1) infinite}
.thread .tq .send{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:var(--blue);display:grid;place-items:center;transition:transform .3s var(--settle)}
.thread .tq .send svg{width:16px;height:16px}
.thread .tq .send.dip{transform:scale(.86)}
.thread .ta{display:grid;grid-template-rows:0fr;transition:grid-template-rows 1.2s var(--cine)}
.thread .ta>div{overflow:hidden;min-height:0}
.thread .ta.open{grid-template-rows:1fr}
.thread .ta .in{padding:12px 14px 14px 48px;border-top:1px solid var(--hair);opacity:0;filter:blur(4px);transform:translateY(6px);transition:opacity 1s var(--ease) .4s,filter 1s var(--ease) .4s,transform 1.2s var(--settle) .35s}

/* circles */
.circles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}

@media (max-width:980px){.circles{gap:14px}}
/* on phones the circles become calm rows: no sideways scrolling */
.clist{display:none;list-style:none;margin:0;padding:6px 0;border-radius:var(--r-card);background:var(--surface);box-shadow:0 1px 0 rgba(0,0,0,.03),0 10px 30px rgba(0,0,0,.06)}
.clist li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:center;padding:12px 14px}

.clist .mem{font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.clist .mem b{font-weight:500;color:var(--ink)}

/* heads */
.head .h2{margin-top:14px;max-width:15em}
.head .lede{margin-top:20px}
.ctr{text-align:center}
.ctr .h2,.ctr .lede{margin-left:auto;margin-right:auto}

/* the immersive frame: film fills it, the glass sits inside it, nothing hangs over the edge */
.stage{position:relative;border-radius:var(--r-frame);overflow:hidden;background:#111;isolation:isolate;min-height:clamp(540px,46vw,700px);display:flex;align-items:flex-end;justify-content:flex-end;padding:clamp(20px,2.4vw,32px)}
.stage.left{justify-content:flex-start}

.stage .comp>*{width:100%}
@media (max-width:760px){.stage{min-height:0;padding:max(240px,62vw) 10px 10px;border-radius:22px}.stage .comp{width:100%}}

/* share control */
.share{width:min(420px,100%);padding:8px}

/* sources: where it lives */
.sources{display:flex;flex-wrap:wrap;gap:10px}
@media (max-width:560px){.sources{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sources .src{padding:0 10px 0 7px;font-size:14px;gap:9px;height:46px;white-space:nowrap;overflow:hidden}.srcwrap [data-sources]>div:last-child{justify-content:stretch!important}.one{width:100%;justify-content:center}}
.src{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px 0 8px;border-radius:14px;font-size:15px;font-weight:500;color:var(--ink);opacity:.35;transform:translateY(6px);transition:opacity .8s var(--ease),transform 1s var(--settle)}
.src.lit{opacity:1;transform:none}

/* yours */
.points{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
