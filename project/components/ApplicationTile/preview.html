<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--ground:#f5f5f7;--surface:#ffffff;--ink:#1a1a1a;--body:#43444d;--muted:#5b5c66;--faint:#80818d;--hairline:rgba(0,0,0,0.06);--blue:#4a6fa5;--blue-hover:#436598;--blue-light:#7fa3d6;--blue-tint:rgba(74,111,165,0.10);--chart-accent:var(--blue);--chart-comparison:#9a9ba6;--chart-step-1:#c2c3ca;--chart-step-2:#e0e1e6;--chart-grid:#e4e4e8;--scrim:rgba(0,0,0,0.42);--glass-tint-top:rgba(255,255,255,0.40);--glass-tint-bottom:rgba(255,255,255,0.26);--glass-dark-top:rgba(255,255,255,0.74);--glass-dark-bottom:rgba(255,255,255,0.62);--glass-nav:rgba(255,255,255,0.62);--glass-rim:rgba(255,255,255,0.95);--bloom-blue:#4a6fa5;--bloom-warm:#ffd9b0;--film-host-page:#f2f2ee;--film-host-paper:#fafaf8;--endcard-black:#050505;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-12:48px;--space-18:72px;--space-30:120px;--radius-panel:16px;--radius-card:12px;--radius-tile:10px;--radius-doc:8px;--radius-ask:24px;--radius-pill:999px;--shadow-glass:inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(0,0,0,0.06), 0 30px 80px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.10);--shadow-glass-ground:inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(0,0,0,0.06), 0 30px 80px rgba(0,0,0,0.18), 0 2px 6px rgba(0,0,0,0.06);--shadow-doc:0 1px 0 rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.14);--shadow-ask:0 24px 60px rgba(0,0,0,0.18);--shadow-stage:0 12px 40px rgba(0,0,0,0.06);--shadow-knob:0 1px 3px rgba(0,0,0,0.18);--opacity-disabled:0.4;--opacity-bloom-blue:0.18;--opacity-bloom-warm:0.15;--opacity-scrim:0.42;--opacity-second-line:0.78;--opacity-film-vignette:0.13;--opacity-endcard-atmosphere:0.2;--font-sans:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;--font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);background:var(--ground);color:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
h1,h2,h3,h4{margin:0;color:var(--ink);font-weight:500;letter-spacing:-.02em;line-height:1.04}
p{margin:0}
.stage{padding:var(--space-6)}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--faint);line-height:1.2}
.cap{font-size:13px;color:var(--muted);line-height:1.45}
.row{display:flex;flex-wrap:wrap;gap:var(--space-5);align-items:center}
.col{display:grid;gap:var(--space-3)}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}


.glass{position:relative;isolation:isolate;overflow:hidden;border-radius:var(--radius-panel);color:var(--ink);
 background:linear-gradient(180deg,var(--glass-tint-top),var(--glass-tint-bottom));
 -webkit-backdrop-filter:blur(2px) saturate(1.7) brightness(1.04);
 backdrop-filter:blur(2px) saturate(1.7) brightness(1.04);
 backdrop-filter:url(#lens) blur(2px) saturate(1.7) brightness(1.04);
 box-shadow:var(--shadow-glass)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
 background:linear-gradient(180deg,#fff 0%,rgba(255,255,255,.12) 45%,rgba(255,255,255,.28) 100%);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
 mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.glass>*{position:relative;z-index:3}
.glass--dark{background:linear-gradient(180deg,var(--glass-dark-top),var(--glass-dark-bottom))}
.glass--ground{box-shadow:var(--shadow-glass-ground)}

.stage{display:grid;gap:var(--space-5)}
.bed{position:relative;border-radius:var(--radius-panel);overflow:hidden;background:var(--ground);padding:24px;isolation:isolate}
.bloom{position:absolute;border-radius:50%;filter:blur(90px);z-index:0}
.bb{width:70%;height:160%;background:var(--bloom-blue);opacity:var(--opacity-bloom-blue);left:-20%;top:-50%}
.bw{width:60%;height:140%;background:var(--bloom-warm);opacity:var(--opacity-bloom-warm);right:-15%;bottom:-50%}
.tiles{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{border-radius:var(--radius-card);background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7);padding:16px 18px;position:relative}
.tile .nm{font-size:20px;font-weight:500;color:var(--ink);letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.tile .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);display:block}
.tile .st{font-size:16px;color:var(--body);margin-top:6px}
.tile .state{position:absolute;right:16px;top:16px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--blue)}
@media (max-width:640px){.tiles{grid-template-columns:1fr}}
</style>
<div class="stage"><div class="bed"><div class="bloom bb"></div><div class="bloom bw"></div>
 <div class="tiles">
  <div class="tile"><span class="state">Live</span><div class="nm"><i class="dot"></i>Circle</div><p class="st">Lisbon, four of you. £0 between you.</p></div>
  <div class="tile"><span class="state">Drafted</span><div class="nm"><i class="dot"></i>Trip</div><p class="st">Nine days. Itinerary drafted, hotel held.</p></div>
  <div class="tile"><span class="state">Booked</span><div class="nm"><i class="dot"></i>Health</div><p class="st">Check-up on the 14th. Three runs this week.</p></div>
  <div class="tile"><span class="state">Day 12</span><div class="nm"><i class="dot"></i>Learning</div><p class="st">Portuguese. Ten minutes, when you like.</p></div>
 </div>
</div></div>
